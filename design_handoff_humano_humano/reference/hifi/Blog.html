<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Humano · Humano — Diario</title>
<link rel="stylesheet" href="landing.css"/>
<link rel="stylesheet" href="course-detail.css"/>
<link rel="stylesheet" href="dashboard.css"/>
<link rel="stylesheet" href="checkout.css"/>
<link rel="stylesheet" href="blog.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../tweaks-panel.jsx"></script>
<script type="text/babel" src="zodiac-wheel.jsx"></script>
<script type="text/babel" src="desktop.jsx"></script>
<script type="text/babel" src="blog.jsx"></script>

<script type="text/babel" data-presets="env,react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "font": "cinzel",
  "density": "normal"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    const root = document.documentElement;
    root.setAttribute('data-theme', tweaks.theme);
    root.setAttribute('data-font', tweaks.font);
    root.setAttribute('data-density', tweaks.density);
  }, [tweaks.theme, tweaks.font, tweaks.density]);

  return (
    <div data-screen-label="Blog hi-fi">
      <div className="starfield"></div>
      <div className="stage-label"><span className="num">VIII</span>Diario · Anotaciones</div>

      <div className="stage">
        <Blog/>
        <div className="mobile-wrap">
          <MobileBlog/>
          <div className="device-label">— MOBILE 320 —</div>
        </div>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Atmósfera">
          <TweakRadio label="Tema" value={tweaks.theme} onChange={v => setTweak('theme', v)}
            options={[{value:'dark',label:'☾ Cosmos'},{value:'light',label:'☀ Pergamino'}]}/>
        </TweakSection>
        <TweakSection title="Tipografía">
          <TweakRadio label="Familia display" value={tweaks.font} onChange={v => setTweak('font', v)}
            options={[{value:'cinzel',label:'Cinzel'},{value:'cormorant',label:'Cormorant'},{value:'cardo',label:'Cardo'}]}/>
        </TweakSection>
        <TweakSection title="Espaciado">
          <TweakRadio label="Densidad" value={tweaks.density} onChange={v => setTweak('density', v)}
            options={[{value:'compact',label:'Compacto'},{value:'normal',label:'Normal'},{value:'airy',label:'Aireado'}]}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
